[package]
name = "corvus-sweep"
version = "0.3.0"
edition = "2024"
description = "Live, seamlessly stitched wideband spectrum for an RFOne running the Corvus sweep firmware"
license = "MIT"
repository = "https://github.com/auggiesoft/corvus"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36.2"
libloading = "0.9.0"
nusb = "0.2.9"
log = "0.4.34"
env_logger = "0.11.11"
parking_lot = "0.12.5"
png = "0.18.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
# The FFTs and the per-step bookkeeping are too slow unoptimised to keep up with ~800 steps/s.
opt-level = 2

[profile.release]
lto = "thin"
